<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Nuevo Registro de Alquiler - BLOCKBUSTER FAKE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-black text-warning">

<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
  <div class="container-fluid justify-content-center">
    <span class="navbar-brand fs-3 fw-bold">BLOCKBUSTER FAKE</span>
  </div>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

      <div class="card bg-dark text-warning border-warning shadow-sm">
        <div class="card-body p-4">
          <h3 class="card-title mb-4 border-bottom border-warning pb-2 text-center">Crear Nuevo Alquiler</h3>

          <div th:if="${mensaje}" class="alert alert-warning" role="alert" th:text="${mensaje}"></div>
          <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

          <form th:action="@{/alquileres/procesar}" method="post" class="needs-validation" novalidate>
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre Completo</label>
              <input type="text" id="nombre" name="nombre" class="form-control bg-black text-warning border-warning" placeholder="Ingrese su nombre" required />
              <div class="invalid-feedback text-warning">
                Debe ingresar su nombre completo.
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Correo Electrónico</label>
              <input type="email" id="email" name="email" class="form-control bg-black text-warning border-warning" placeholder="ejemplo@correo.com" required />
              <div class="invalid-feedback text-warning">
                Debe ingresar un correo válido.
              </div>
            </div>

            <div class="mb-3">
              <label for="pelicula" class="form-label">Seleccione la Película</label>
              <select id="pelicula" name="peliculaId" class="form-select bg-black text-warning border-warning" onchange="actualizarInfo()" required>
                <option value="" disabled selected>-- Elija una opción --</option>
                <option th:each="p : ${peliculas}" 
                        th:value="${p.idPelicula}" 
                        th:data-genero="${p.genero}" 
                        th:data-stock="${p.stock}" 
                        th:text="${p.titulo}"></option>
              </select>
              <div class="invalid-feedback text-warning">
                Debe seleccionar una película.
              </div>
            </div>

            <div id="infoPelicula" class="mb-3" style="display:none;">
              <p class="mb-1"><strong>Género:</strong> <span id="gen">-</span></p>
              <p><strong>Stock disponible:</strong> <span id="stk">-</span></p>
            </div>

            <div class="mb-4">
              <label for="cantidad" class="form-label">Cantidad a alquilar</label>
              <input type="number" id="cantidad" name="cantidad" min="1" value="1" class="form-control bg-black text-warning border-warning" required />
              <div class="invalid-feedback text-warning">
                Ingrese una cantidad válida (mínimo 1).
              </div>
            </div>

            <div class="d-flex justify-content-between">
              <button type="submit" class="btn btn-outline-warning px-4 fw-bold">Confirmar</button>
              <a href="/" class="btn btn-outline-warning px-4 fw-bold">Cancelar</a>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  function actualizarInfo() {
    const sel = document.getElementById('pelicula');
    const opt = sel.selectedOptions[0];
    if (!opt || !opt.value) {
      document.getElementById('infoPelicula').style.display = 'none';
      return;
    }
    document.getElementById('gen').textContent = opt.getAttribute('data-genero');
    document.getElementById('stk').textContent = opt.getAttribute('data-stock');
    document.getElementById('infoPelicula').style.display = 'block';
  }

  (() => {
    'use strict';
    const forms = document.querySelectorAll('.needs-validation');
    Array.from(forms).forEach(form => {
      form.addEventListener('submit', event => {
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
        }
        form.classList.add('was-validated');
      }, false);
    });
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
