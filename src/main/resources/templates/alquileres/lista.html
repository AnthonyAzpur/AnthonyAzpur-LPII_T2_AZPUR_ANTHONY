<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Lista de Alquileres</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-black text-light">

<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
  <div class="container-fluid justify-content-center">
    <span class="navbar-brand fs-3 fw-bold text-warning">BLOCKBUSTER FAKE</span>
  </div>
</nav>

<div class="container py-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-warning fw-bold">Lista de Alquileres</h2>
    <div>
      <a th:href="@{/alquileres/nuevo}" class="btn btn-outline-warning me-2">Nuevo Alquiler</a>
      <a th:href="@{/index}" class="btn btn-outline-light">Home</a>
    </div>
  </div>

  <div class="table-responsive rounded-4 border border-warning p-3 bg-dark shadow">
    <table class="table table-dark table-hover align-middle text-center">
      <thead class="table-warning text-dark">
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Fecha</th>
          <th>Estado</th>
          <th>Total</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="alq : ${alquileres}">
          <td th:text="${alq.id}" class="text-warning fw-bold"></td>
          <td th:text="${alq.cliente.nombre}"></td>
          <td th:text="${alq.fecha}"></td>
          <td th:text="${alq.estado}"></td>
          <td th:text="${alq.total}"></td>
          <td>
            <a th:href="@{/alquileres/detalle(id=${alq.id})}" class="btn btn-sm btn-info">Ver Detalle</a>
            <a th:if="${alq.estado.name() != 'DEVUELTO'}"
               th:href="@{/alquileres/devolver/{id}(id=${alq.id})}"
               class="btn btn-sm btn-warning ms-2"
               onclick="return confirm('¿Confirma la devolución del alquiler?');">
               Devolver
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-center mt-4">
    <a href="/" class="btn btn-outline-warning btn-lg px-5 rounded-pill">Volver</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
