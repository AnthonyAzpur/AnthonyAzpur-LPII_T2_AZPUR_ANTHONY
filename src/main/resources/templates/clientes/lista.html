<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Usuarios Registrados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-black text-light">

<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
  <div class="container-fluid justify-content-center">
    <span class="navbar-brand fs-3 fw-bold text-warning">BLOCKBUSTER FAKE</span>
  </div>
</nav>

<div class="container py-5">

  <h1 class="mb-4 fw-bold text-warning text-center">Usuarios Registrados</h1>

  <div th:if="${mensaje}" class="alert alert-warning text-center fw-semibold" th:text="${mensaje}"></div>
  <div th:if="${error}" class="alert alert-danger text-center fw-semibold" th:text="${error}"></div>

  <div class="table-responsive rounded-4 border border-warning p-3 bg-dark shadow">
    <table class="table table-dark table-hover align-middle text-center">
      <thead class="table-warning text-dark">
        <tr>
          <th scope="col" class="text-center">#ID</th>
          <th scope="col">Nombre Completo</th>
          <th scope="col">Correo Electrónico</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="cli : ${clientes}" class="border-bottom border-warning">
          <td class="text-warning fw-bold" th:text="${cli.id}">1</td>
          <td class="fw-semibold" th:text="${cli.nombre}">Nombre Cliente</td>
          <td class="text-muted" th:text="${cli.email}">email@ejemplo.com</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-center mt-5">
    <a href="/" class="btn btn-outline-warning btn-lg px-5 rounded-pill">Volver al Inicio</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
