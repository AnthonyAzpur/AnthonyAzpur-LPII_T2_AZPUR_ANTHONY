<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8" />
  <title th:text="${pelicula.idPelicula == null} ? 'Nueva Película' : 'Modificar Película'">Película</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
  <div class="container-fluid justify-content-center">
    <span class="navbar-brand fs-3 fw-bold text-warning">BLOCKBUSTER FAKE</span>
  </div>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6 bg-secondary p-5 rounded-4 border border-warning shadow-lg">
      <h4 class="text-center text-warning mb-4" th:text="${pelicula.idPelicula == null} ? 'Registrar Nueva Película' : 'Editar Película Existente'"></h4>

      <form th:action="@{/peliculas}" th:object="${pelicula}" method="post">
        <input type="hidden" th:field="*{idPelicula}" />

        <div class="mb-3">
          <label for="titulo" class="form-label text-white-50">Título</label>
          <input type="text" id="titulo" th:field="*{titulo}" class="form-control bg-dark text-light border-0 border-bottom border-warning" required />
        </div>

        <div class="mb-3">
          <label for="genero" class="form-label text-white-50">Género</label>
          <input type="text" id="genero" th:field="*{genero}" class="form-control bg-dark text-light border-0 border-bottom border-warning" required />
        </div>

        <div class="mb-4">
          <label for="stock" class="form-label text-white-50">Stock Disponible</label>
          <input type="number" id="stock" th:field="*{stock}" class="form-control bg-dark text-light border-0 border-bottom border-warning" min="0" required />
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-warning text-dark fw-semibold" 
                  th:text="${pelicula.idPelicula == null} ? 'Guardar Película' : 'Actualizar Datos'"></button>
          <a href="/peliculas" class="btn btn-outline-light">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
