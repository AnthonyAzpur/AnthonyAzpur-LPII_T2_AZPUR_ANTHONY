<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crear Película</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Crear Nueva Película</h1>

    <form th:action="@{/peliculas}" th:object="${pelicula}" method="post">
        <div class="mb-3">
            <label for="titulo" class="form-label">Título:</label>
            <input type="text" id="titulo" th:field="*{titulo}" required class="form-control" />
        </div>

        <div class="mb-3">
            <label for="genero" class="form-label">Género:</label>
            <input type="text" id="genero" th:field="*{genero}" required class="form-control" />
        </div>

        <div class="mb-3">
            <label for="stock" class="form-label">Stock:</label>
            <input type="number" id="stock" th:field="*{stock}" required min="0" class="form-control" />
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="/peliculas" class="btn btn-secondary ms-2">Volver al listado</a>
    </form>
</div>

<!-- Bootstrap JS (opcional para funcionalidades dinámicas) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
