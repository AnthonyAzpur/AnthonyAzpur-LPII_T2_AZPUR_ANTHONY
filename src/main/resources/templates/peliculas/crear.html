<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Blockbuster | Agregar Película</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
  <div class="container-fluid justify-content-center">
    <span class="navbar-brand mb-0 fs-2 fw-bold text-warning">BLOCKBUSTER FAKE</span>
  </div>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 bg-secondary p-5 rounded-4 shadow-lg border border-warning">
      <h3 class="text-center text-warning mb-4">Nueva Entrada en Cartelera</h3>

      <form th:action="@{/peliculas}" th:object="${pelicula}" method="post">
        <div class="row mb-3">
          <div class="col-12">
            <label for="titulo" class="form-label text-white-50">Nombre de la Película</label>
            <input type="text" id="titulo" th:field="*{titulo}" class="form-control bg-dark text-light border-0 border-bottom border-warning" required>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-12">
            <label for="genero" class="form-label text-white-50">Categoría o Género</label>
            <input type="text" id="genero" th:field="*{genero}" class="form-control bg-dark text-light border-0 border-bottom border-warning" required>
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-12">
            <label for="stock" class="form-label text-white-50">Cantidad en Inventario</label>
            <input type="number" id="stock" th:field="*{stock}" class="form-control bg-dark text-light border-0 border-bottom border-warning" required min="0">
          </div>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-warning text-dark fw-bold">Guardar Película</button>
          <a href="/peliculas" class="btn btn-outline-light">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
