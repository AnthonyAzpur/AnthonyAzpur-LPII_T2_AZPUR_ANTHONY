<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo de Películas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
  <div class="container-fluid justify-content-center">
    <span class="navbar-brand fs-3 fw-bold text-warning">BLOCKBUSTER FAKE</span>
  </div>
</nav>

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-warning">Películas Registradas</h2>
    <div>
      <a href="/peliculas/nuevo" class="btn btn-outline-warning me-2">Nueva Película</a>
      <a href="/index" class="btn btn-outline-light">Inicio</a>
    </div>
  </div>

<div th:if="${mensaje != null and mensaje != ''}" class="alert alert-success text-center" th:text="${mensaje}"></div>
<div th:if="${error != null and error != ''}" class="alert alert-danger text-center" th:text="${error}"></div>

  <div th:if="${#lists.isEmpty(peliculas)}" class="alert alert-warning text-center">
    No hay películas cargadas en el sistema.
  </div>

  <div th:if="${!#lists.isEmpty(peliculas)}" class="table-responsive rounded-4 border border-warning p-3 bg-dark shadow">
    <table class="table table-dark table-hover align-middle text-center">
      <thead class="table-primary text-dark">
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Género</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="pelicula : ${peliculas}">
          <td th:text="${pelicula.idPelicula}"></td>
          <td th:text="${pelicula.titulo}"></td>
          <td th:text="${pelicula.genero}"></td>
          <td th:text="${pelicula.stock}"></td>
          <td>
            <a th:href="@{/peliculas/editar/{id}(id=${pelicula.idPelicula})}" class="btn btn-sm btn-outline-primary me-2">Editar</a>
            <a th:href="@{/peliculas/eliminar/{id}(id=${pelicula.idPelicula})}"
               class="btn btn-sm btn-outline-danger"
               onclick="return confirm('¿Seguro que deseas eliminar esta película?');">Eliminar</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
